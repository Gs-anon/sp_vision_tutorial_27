#需要自行将配置文件中的相机参数补全

# 相机参数（枚举值见 hikrobot/include/CameraParams.h）
camera:
  balance_white_auto: 1   # MV_BALANCEWHITE_AUTO_CONTINUOUS 连续自动白平衡
  exposure_auto: 0        # MV_EXPOSURE_AUTO_MODE_OFF 关闭自动曝光
  gain_auto: 0            # MV_GAIN_MODE_OFF 关闭自动增益
  exposure_time: 10000.0  # 曝光时间 (us)
  gain: 20.0              # 增益 (dB)
  frame_rate: 60.0        # 帧率 (fps)

yolo_name: yolov5
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false
threshold: 150

# AprilTag配置

# 检测参数
auto_charge:
  # AprilTag配置
  tag_family: "tag36h11"
  tag_size: 0.080  # m
  tag_ids: [10, 18, 24]
  corner_refinement_method: 1  # CORNER_REFINE_SUBPIX
  min_marker_perimeter_rate: 0.03
  adaptive_thresh_win_size_min: 3
  adaptive_thresh_win_size_max: 23
  adaptive_thresh_win_size_step: 10
  adaptive_thresh_constant: 7.0
  